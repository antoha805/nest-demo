name: Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx eslint "{src,test}/**/*.ts"
      - run: npm test
      - run: npm run build

  publish:
    needs: test
    # The EC2 instance is Arm, so build natively rather than under emulation.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/antoha805/nest-demo:latest
            ghcr.io/antoha805/nest-demo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
